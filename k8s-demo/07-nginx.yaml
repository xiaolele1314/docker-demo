# Nginx 部署 + NodePort 暴露给外网
---
# 用 ConfigMap 存 Nginx 配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: demo
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>K8s Demo</title>
        <style>
            *{margin:0;padding:0;box-sizing:border-box}
            body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;padding:2rem}
            h1{font-size:1.5rem;margin-bottom:1.5rem;color:#38bdf8}
            .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1.5rem}
            .card{background:#1e293b;border-radius:8px;padding:1.2rem;border:1px solid #334155}
            .card h2{font-size:1rem;color:#94a3b8;margin-bottom:.8rem}
            .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
            .dot.ok{background:#22c55e}.dot.err{background:#ef4444}
            pre{background:#0f172a;padding:.8rem;border-radius:4px;font-size:.85rem;overflow-x:auto;color:#cbd5e1}
            button{background:#2563eb;color:#fff;border:none;padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-size:.9rem;margin-bottom:1rem}
            button:hover{background:#1d4ed8}
            table{width:100%;border-collapse:collapse;font-size:.85rem}
            th,td{padding:.5rem .8rem;text-align:left;border-bottom:1px solid #334155}
            th{color:#94a3b8}
            .pod-tag{background:#7c3aed;color:#fff;padding:2px 8px;border-radius:4px;font-size:.75rem}
        </style>
    </head>
    <body>
        <h1>K8s Multi-Service Demo</h1>
        <div class="cards">
            <div class="card">
                <h2>Service Health</h2>
                <div id="health">Loading...</div>
            </div>
            <div class="card">
                <h2>Visit Counter (watch Pod name change = load balancing)</h2>
                <button onclick="recordVisit()">Click to Visit</button>
                <pre id="visit-result">click the button multiple times</pre>
            </div>
        </div>
        <div class="card">
            <h2>Recent Visitors</h2>
            <div id="visitors">Loading...</div>
        </div>
        <script>
            async function checkHealth(){
                try{const r=await fetch('/api/health');const d=await r.json();
                document.getElementById('health').innerHTML=
                    `<p><span class="dot ${d.mysql==='ok'?'ok':'err'}"></span>MySQL: ${d.mysql}</p>`+
                    `<p><span class="dot ${d.redis==='ok'?'ok':'err'}"></span>Redis: ${d.redis}</p>`+
                    `<p>Pod: <span class="pod-tag">${d.pod}</span></p>`;
                }catch(e){document.getElementById('health').innerHTML='<p><span class="dot err"></span>API unreachable</p>'}}
            async function recordVisit(){
                const r=await fetch('/api/visit');const d=await r.json();
                document.getElementById('visit-result').textContent=JSON.stringify(d,null,2);loadVisitors()}
            async function loadVisitors(){
                try{const r=await fetch('/api/visitors');const rows=await r.json();
                if(!rows.length){document.getElementById('visitors').innerHTML='No data';return}
                let h='<table><tr><th>ID</th><th>IP</th><th>Path</th><th>Time</th></tr>';
                rows.forEach(r=>{h+=`<tr><td>${r.id}</td><td>${r.ip}</td><td>${r.path}</td><td>${r.visited_at}</td></tr>`});
                h+='</table>';document.getElementById('visitors').innerHTML=h}catch(e){document.getElementById('visitors').innerHTML='Failed'}}
            checkHealth();loadVisitors()
        </script>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html

      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-html
          configMap:
            name: nginx-config
            items:
              - key: index.html
                path: index.html

---
# NodePort Service：暴露给外网访问
# ClusterIP 只能集群内访问，NodePort 可以通过 节点IP:端口 从外部访问
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: demo
spec:
  selector:
    app: nginx
  ports:
    - port: 80               # Service 端口（集群内用）
      targetPort: 80          # Pod 端口
      nodePort: 30080         # 宿主机端口（外部访问用）范围 30000-32767
  type: NodePort              # 暴露到节点端口
